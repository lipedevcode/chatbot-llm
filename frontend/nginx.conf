server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Permite upload de PDFs (feature de anexos). Sem isto o default do nginx é 1MB (413).
    # Um pouco acima do limite por arquivo (50MB) para cobrir overhead do multipart.
    client_max_body_size 55m;

    # Endpoint de streaming (SSE) da resposta do chat. Precisa de tratamento
    # próprio: com o buffering padrão do nginx a resposta inteira seria acumulada
    # e entregue de uma vez, anulando o streaming token a token. Como o nginx casa
    # o prefixo mais específico, este bloco tem precedência sobre /api/ abaixo.
    location /api/v1/chat/message/stream {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mantém a conexão upstream aberta e repassa cada chunk imediatamente.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # Respostas de LLM podem levar mais que o default (60s). Acima do timeout do
        # SseEmitter no backend (120s) para o backend encerrar primeiro.
        proxy_read_timeout 300s;
    }

    location /api/ {
        # Permite anexar PDFs maiores que o limite padrão do nginx (1m).
        client_max_body_size 50m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Assets com hash no nome (Vite): o nome muda a cada build, então podem ser
    # cacheados agressivamente e para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # O index.html (shell do SPA) referencia os bundles por hash. Se ele ficar
        # preso em cache, o navegador continua carregando um bundle antigo após um
        # deploy (ex.: rodando o fluxo antigo sem streaming). "no-cache" força
        # revalidação por ETag a cada carga, servindo sempre o HTML atual.
        add_header Cache-Control "no-cache";
    }
}
